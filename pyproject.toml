[project]
name = "data-scraper"
version = "0.17.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]